<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pediatric Doctor Management System</title>
    <style>
        /* Using Poppins font to match the animation style */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1b1e; /* Dark background for the animations */
            overflow: hidden; /* Hide overflow from animations */
        }

        /* The main container that will have the rotating border */
        .login-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            /* Height adjusted to fit content */
            min-height: 600px; 
            background: #1c1c1c;
            border-radius: 20px;
            overflow: hidden;
            padding: 4px; /* A small gap for the border to show */
        }
        
        /* The ::before pseudo-element creates the rotating border effect */
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 400px;
            /* Adjusted height to cover the container */
            height: 600px; 
            background: linear-gradient(0deg, transparent, #45f3ff, #45f3ff);
            transform-origin: bottom right;
            animation: rotate-border 6s linear infinite;
        }
        
        /* The ::after pseudo-element is a delayed copy for a second rotating line */
        .login-container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 400px;
            height: 600px;
            background: linear-gradient(0deg, transparent, #45f3ff, #45f3ff);
            transform-origin: bottom right;
            animation: rotate-border 6s linear infinite;
            animation-delay: -3s; /* Delay for the second line */
        }
        
        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Background Animation for the floating squares --- */
        .floating-squares span {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #45f3ff;
            opacity: 0;
            border-radius: 4px;
            animation: float-up 10s linear infinite;
            animation-delay: calc(0.2s * var(--i));
            animation-duration: calc(5s + (var(--i) * 0.5s));
            left: calc(10% * (var(--i) % 10));
            z-index: -1; /* Place squares behind the login box */
        }
        
        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                bottom: -150px; /* Start from below the screen */
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                bottom: 100%;
            }
        }
        
        /* An inner container for the content, placed on top of the animations */
        .content-wrapper {
            position: relative;
            background: #222;
            border-radius: 16px;
            z-index: 2;
            padding: 40px;
            text-align: center;
            height: 100%;
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo img {
            height: 100px; /* Adjusted size */
            width: 100px;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #45f3ff;
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 0.1em;
        }

        .logo p {
            color: #8f8f8f;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #8f8f8f;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #8f8f8f;
            background: transparent;
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #45f3ff;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: #45f3ff;
            color: #1c1c1c;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px #45f3ff;
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .alert-error {
            background-color: #5c2222;
            border: 1px solid #c53030;
            color: #fed7d7;
        }

        .alert-success {
            background-color: #1c3d2e;
            border: 1px solid #276749;
            color: #f0fff4;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .role-info {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .role-info h3 {
            color: #45f3ff;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .role-info ul {
            list-style: none;
            padding: 0;
        }

        .role-info li {
            padding: 5px 0;
            color: #8f8f8f;
            font-size: 0.9rem;
        }

        .role-info li strong {
            color: #fff;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 2px;
            }
            .content-wrapper {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-squares">
        <!-- Spans for the floating squares background animation -->
        <span style="--i:0;"></span><span style="--i:1;"></span><span style="--i:2;"></span><span style="--i:3;"></span><span style="--i:4;"></span><span style="--i:5;"></span><span style="--i:6;"></span><span style="--i:7;"></span><span style="--i:8;"></span><span style="--i:9;"></span><span style="--i:10;"></span><span style="--i:11;"></span><span style="--i:12;"></span><span style="--i:13;"></span><span style="--i:14;"></span><span style="--i:15;"></span><span style="--i:16;"></span><span style="--i:17;"></span><span style="--i:18;"></span><span style="--i:19;"></span><span style="--i:20;"></span>
    </div>

    <div class="login-container">
        <div class="content-wrapper">
            <div class="logo">
                <img src="/shtk.png" alt="Clinic Logo" onerror="this.style.display='none'">
                <h1>Se7atech صـــ7ـــتك</h1>
                <p>Management System</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span id="login-loading" class="loading" style="display: none;"></span>
                    Login
                </button>
            </form>

            <div class="role-info">
                <h3>User Roles:</h3>
                <ul>
                    <li><strong>Admin:</strong> Full access to all features, user management</li>
                    <li><strong>User:</strong> Patient management, reservations, reports</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });

        async function checkSession() {
            try {
                const response = await fetch('/api/auth/check-session');
                const data = await response.json();
                
                if (data.authenticated) {
                    // Redirect to main app if already logged in
                    window.location.href = '/';
                }
            } catch (error) {
                console.log('Session check failed:', error);
            }
        }

        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loadingSpinner = document.getElementById('login-loading');
            const loginBtn = document.getElementById('login-btn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            loadingSpinner.style.display = 'inline-block';
            loginBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Redirect to main app after short delay
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'error');
                console.error('Login error:', error);
            } finally {
                loadingSpinner.style.display = 'none';
                loginBtn.disabled = false;
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            
            // Auto-remove alert after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Handle Enter key in form fields
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
